name: Train PPO Model

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers (empty = use DEFAULT_SYMBOLS)"
        default: ""
      interval:
        description: "Bar interval (e.g. 5m, 15m, 1h)"
        default: "5m"
      period:
        description: "Lookback (e.g. 60d, 1825d, 5y). yfinance 5m max is 60d; alpaca supports years."
        default: "1825d"
      timesteps:
        description: "Total PPO timesteps for this run"
        default: "1000000"
      n_envs:
        description: "Parallel envs"
        default: "4"
      data_source:
        description: "yfinance | alpaca"
        default: "alpaca"
  schedule:
    # 매시간 정각(UTC)에 이어 학습
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: ppo-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Date stamp (cache key)
        id: date
        run: echo "value=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: ${{ github.event.inputs.data_source || 'alpaca' }}-${{ github.event.inputs.interval || '5m' }}-${{ github.event.inputs.period || '1825d' }}-${{ steps.date.outputs.value }}
          restore-keys: |
            ${{ github.event.inputs.data_source || 'alpaca' }}-${{ github.event.inputs.interval || '5m' }}-${{ github.event.inputs.period || '1825d' }}-

      - name: Train (resume if model exists)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DATA_SOURCE: ${{ github.event.inputs.data_source || 'alpaca' }}
        run: |
          SYMS="${{ github.event.inputs.symbols }}"
          python -m ppo_trader.train \
            ${SYMS:+--symbols $SYMS} \
            --interval ${{ github.event.inputs.interval || '5m' }} \
            --period ${{ github.event.inputs.period || '1825d' }} \
            --timesteps ${{ github.event.inputs.timesteps || '1000000' }} \
            --n-envs ${{ github.event.inputs.n_envs || '4' }} \
            --save-path models/ppo_daytrader

      - name: Evaluate held-out split
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DATA_SOURCE: ${{ github.event.inputs.data_source || 'alpaca' }}
        run: |
          SYMS="${{ github.event.inputs.symbols }}"
          python -m ppo_trader.evaluate \
            --model models/ppo_daytrader \
            ${SYMS:+--symbols $SYMS} \
            --interval ${{ github.event.inputs.interval || '5m' }} \
            --period ${{ github.event.inputs.period || '1825d' }} \
            | tee eval_report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppo-daytrader-${{ github.run_number }}
          path: |
            models/ppo_daytrader.zip
            eval_report.txt
          retention-days: 14

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ppo_daytrader.zip
          git diff --cached --quiet && echo "no model changes" || git commit -m "chore: continual PPO retrain [skip ci]"
          git push || true
