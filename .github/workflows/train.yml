name: Train PPO Model

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers"
        default: "AAPL MSFT NVDA TSLA AMD"
      interval:
        description: "Bar interval (e.g. 5m, 15m, 1h)"
        default: "5m"
      period:
        description: "yfinance period (e.g. 60d)"
        default: "60d"
      timesteps:
        description: "Total PPO timesteps"
        default: "300000"
      n_envs:
        description: "Parallel envs"
        default: "2"
  schedule:
    # 매주 일요일 02:00 UTC (= KST 일요일 11:00)에 자동 재학습
    - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: ppo-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train
        run: |
          python -m ppo_trader.train \
            --symbols ${{ github.event.inputs.symbols || 'AAPL MSFT NVDA TSLA AMD' }} \
            --interval ${{ github.event.inputs.interval || '5m' }} \
            --period ${{ github.event.inputs.period || '60d' }} \
            --timesteps ${{ github.event.inputs.timesteps || '300000' }} \
            --n-envs ${{ github.event.inputs.n_envs || '2' }} \
            --save-path models/ppo_daytrader

      - name: Evaluate held-out split
        continue-on-error: true
        run: |
          python -m ppo_trader.evaluate \
            --model models/ppo_daytrader \
            --symbols ${{ github.event.inputs.symbols || 'AAPL MSFT NVDA TSLA AMD' }} \
            --interval ${{ github.event.inputs.interval || '5m' }} \
            --period ${{ github.event.inputs.period || '60d' }} \
            | tee eval_report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppo-daytrader-${{ github.run_number }}
          path: |
            models/ppo_daytrader.zip
            eval_report.txt
          retention-days: 14

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ppo_daytrader.zip
          git diff --cached --quiet && echo "no model changes" || git commit -m "chore: retrain PPO model [skip ci]"
          git push || true
