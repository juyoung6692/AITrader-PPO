name: Train PPO Scalper (deep)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers"
        default: "AAPL MSFT NVDA TSLA AMD GOOGL META AMZN AVGO NFLX"
      interval:
        description: "Bar interval"
        default: "5m"
      period:
        description: "Lookback (alpaca supports years; default 730d)"
        default: "730d"
      timesteps:
        description: "PPO timesteps for this run"
        default: "1230000"
      n_envs:
        description: "Parallel envs"
        default: "4"
      data_source:
        description: "yfinance | alpaca"
        default: "alpaca"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ppo-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Date stamp (cache key)
        id: date
        run: echo "value=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: ${{ github.event.inputs.data_source || 'alpaca' }}-${{ github.event.inputs.interval || '5m' }}-${{ github.event.inputs.period || '730d' }}-${{ steps.date.outputs.value }}
          restore-keys: |
            ${{ github.event.inputs.data_source || 'alpaca' }}-${{ github.event.inputs.interval || '5m' }}-${{ github.event.inputs.period || '730d' }}-

      - name: Train (resume if model exists)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DATA_SOURCE: ${{ github.event.inputs.data_source || 'alpaca' }}
        run: |
          python -m ppo_trader.scalping_train \
            --symbols ${{ github.event.inputs.symbols || 'AAPL MSFT NVDA TSLA AMD GOOGL META AMZN AVGO NFLX' }} \
            --interval ${{ github.event.inputs.interval || '5m' }} \
            --period ${{ github.event.inputs.period || '730d' }} \
            --timesteps ${{ github.event.inputs.timesteps || '1230000' }} \
            --n-envs ${{ github.event.inputs.n_envs || '4' }} \
            --save-path models/ppo_scalper \
            | tee scalping_report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppo-scalper-deep-${{ github.run_number }}
          path: |
            models/ppo_scalper.zip
            scalping_report.txt
          retention-days: 30

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ppo_scalper.zip
          git diff --cached --quiet && echo "no model changes" || git commit -m "chore: continual scalper retrain (deep) [skip ci]"
          git push || true
